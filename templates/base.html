<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Моя коллекция{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header>
        <div class="container">
            <h1>🎬 Моя коллекция 2.0. </h1>
            <nav>
                <ul>
                    <li><a href="{{ url_for('index') }}">Главная отрисовать</a></li>
                    <li><a href="{{ url_for('add') }}">Добавить</a></li>
                    <li><a href="{{ url_for('about') }}">проекте</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        {% block content %}
        <!-- Здесь будет контент каждой страницы -->
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>© 2026 Моя коллекция. Создано в рамках курса цифровой кафедры.</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
