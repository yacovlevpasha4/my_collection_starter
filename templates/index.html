{% extends "base.html" %}

{% block title %}Главная - Моя коллекция{% endblock %}

{% block content %}
<h2>Моя коллекция</h2>

<!-- Задание: Добавь сюда поле поиска и фильтр по жанрам -->
<div class="controls">
    <input type="text" id="search" placeholder="Поиск по названию...">
    <select id="filter">
        <option value="all">Все жанры</option>
        <!-- Добавь сюда опции жанров -->
    </select>
</div>

<!-- Задание: Создай сетку карточек -->
<div class="grid" id="items-grid">
    <!-- Здесь будут карточки из БД -->
    <!-- Используй цикл: {% for item in items %} ... {% endfor %} -->

    {% for item in items %}
    <a href="/item/{{ item.id }}" class="card" style="text-decoration: none; color: inherit;">
        <img src="{{ item.image_url }}" alt="{{ item.title }}">
        <div class="card-content">
            <h3 class="card-title">{{ item.title }}</h3>
            <p class="card-meta">{{ item.year }} • {{ item.genre }}</p>
            <p class="card-meta-desc">{{ item.description }}</p>
        </div>
    </a>
    {% endfor %}


</div>
{% endblock %}
